<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Nihongo 日语学习助手</title>
  <desc id="desc">用假名书写格、仓库中的第一课助词填空和学生词汇卡，展示假名、语法与间隔复习。</desc>
  <defs>
    <pattern id="kana-grid" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M66 0 H0 V66" fill="none" stroke="#D7DFD4" stroke-width="1" />
    </pattern>
    <clipPath id="canvas">
      <rect width="1200" height="610" rx="26" />
    </clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect x="0" y="0" width="1200" height="610" rx="0" fill="#F4F1E8" />
    <text x="48" y="49" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#6B8C7A" letter-spacing="2">日本語のある毎日。</text>
    <text x="47" y="122" font-family="Georgia, Songti SC, serif" font-size="72" font-weight="500" fill="#394942" letter-spacing="-2">Nihongo</text>
    <text x="51" y="169" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="31" font-weight="600" fill="#394942">日语学习助手</text>
    <text x="51" y="207" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="25" font-weight="400" fill="#778577">一页假名，一句会话。</text>
    <text x="1152" y="47" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="500" fill="#6B8C7A" text-anchor="end">KANA / GRAMMAR / REVIEW</text>
    <rect x="49" y="242" width="281" height="280" rx="3" fill="#FDFBF7" stroke="#BCCDBC" stroke-width="1.5" />
    <rect x="50" y="243" width="279" height="278" rx="2" fill="url(#kana-grid)" />
    <text x="71" y="274" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, PingFang SC, sans-serif" font-size="19" font-weight="500" fill="#6B8C7A">ひらがな</text>
    <text x="190" y="423" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, PingFang SC, sans-serif" font-size="170" font-weight="400" fill="#394942" text-anchor="middle">あ</text>
    <text x="190" y="500" font-family="Georgia, Songti SC, serif" font-size="34" font-weight="400" fill="#D47860" text-anchor="middle">a</text>
