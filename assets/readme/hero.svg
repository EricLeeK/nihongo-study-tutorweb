      <text x="826" y="502" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, PingFang SC, sans-serif" font-size="48" font-weight="500" fill="#394942">学生</text>
      <text x="945" y="502" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, PingFang SC, sans-serif" font-size="25" font-weight="500" fill="#6B8C7A">がくせい</text>
      <path d="M826 517 H1081" fill="none" stroke="#B8C8AF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
      <text x="826" y="549" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="22" font-weight="400" fill="#607B64">名词  ·  学生</text>
    </g>
  </g>
</svg>