      <path d="M416 112 V520" fill="none" stroke="#E6C4B5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
      <text x="441" y="159" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#6B8C7A" letter-spacing="1.5">LESSON 01</text>
      <text x="441" y="206" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans, sans-serif" font-size="30" font-weight="600" fill="#394942">第1課：肯定与否定</text>
      <path d="M440 228 H1109" fill="none" stroke="#D9DDD1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
      <text x="440" y="300" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, PingFang SC, sans-serif" font-size="49" font-weight="400" fill="#394942">私</text>
      <rect x="507" y="254" width="61" height="61" rx="7" fill="#ECF0E5" stroke="#C2CDBD" stroke-width="1.3" />
